name: Packer validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "packer/**"

permissions:
  contents: read

concurrency:
  group: packer-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Packer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3

      - name: Check formatting
        shell: bash
        run: |
          mapfile -d '' templates < <(find packer -type f -name '*.pkr.hcl' -print0)
          if (( ${#templates[@]} == 0 )); then
            echo "::error::No *.pkr.hcl files were found under packer."
            exit 1
          fi

          for template in "${templates[@]}"; do
            packer fmt -check -diff "$template"
          done

      - name: Initialize and validate templates
        shell: bash
        run: |
          mapfile -d '' templates < <(find packer -type f -name '*.pkr.hcl' -print0)

          for template in "${templates[@]}"; do
            packer init "$template"
            packer validate "$template"
          done
